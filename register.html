<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - AI Gift Recommendation</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#fff4f7;
}

/* Header */

header{
background:#ff4f87;
padding:15px 8%;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
color:white;
font-size:28px;
font-weight:bold;
}

nav ul{
display:flex;
list-style:none;
}

nav ul li{
margin-left:25px;
}

nav ul li a{
text-decoration:none;
color:white;
font-size:18px;
font-weight:bold;
}

nav ul li a:hover{
color:yellow;
}

.login-btn{
background:white;
color:#ff4f87;
padding:10px 25px;
border-radius:30px;
text-decoration:none;
font-weight:bold;
}

/* Register Form */

.container{
display:flex;
justify-content:center;
align-items:center;
padding:50px;
}

.register-box{

background:white;

width:500px;

padding:40px;

border-radius:20px;

box-shadow:0 8px 20px rgba(0,0,0,.2);

}

.register-box h1{

text-align:center;

color:#ff4f87;

margin-bottom:30px;

}

.input-box{

margin-bottom:18px;

}

.input-box label{

display:block;

margin-bottom:8px;

font-weight:bold;

}

.input-box input{

width:100%;

padding:14px;

border-radius:10px;

border:2px solid #ff4f87;

font-size:16px;

outline:none;

}

button{

width:100%;

padding:15px;

background:#ff4f87;

color:white;

border:none;

border-radius:30px;

font-size:18px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#e6005c;

}

.login-link{

text-align:center;

margin-top:20px;

}

.login-link a{

text-decoration:none;

color:#ff4f87;

font-weight:bold;

}

footer{

background:#ff4f87;

color:white;

text-align:center;

padding:20px;

margin-top:40px;

}

@media(max-width:600px){

.register-box{

width:95%;

}

nav{

display:none;

}

}

</style>

</head>

<body>

<header>

<div class="logo">

🎁 AI Gift

</div>

<nav>

<ul>

<li><a href="index.html">Home</a></li>

<li><a href="recommendation.html">Occasions</a></li>

<li><a href="favorites.html">Favorites</a></li>

<li><a href="about.html">About Us</a></li>

</ul>

</nav>

<a href="login.html" class="login-btn">

Login

</a>

</header>

<div class="container">

<div class="register-box">

<h1>Create Account</h1>

<div class="input-box">

<label>Full Name</label>

<input type="text" id="name" placeholder="Enter Full Name">

</div>

<div class="input-box">

<label>Email</label>

<input type="email" id="email" placeholder="Enter Email">

</div>

<div class="input-box">

<label>Mobile Number</label>

<input type="tel" id="mobile" placeholder="Enter Mobile Number">

</div>

<div class="input-box">

<label>Password</label>

<input type="password" id="password" placeholder="Create Password">

</div>

<div class="input-box">

<label>Confirm Password</label>

<input type="password" id="confirm" placeholder="Confirm Password">

</div>

<button onclick="registerUser()">

Create Account

</button>

<div class="login-link">

Already have an account?

<a href="login.html">

Login

</a>

</div>

</div>

</div>
<script>

function registerUser(){

let name=document.getElementById("name").value.trim();
let email=document.getElementById("email").value.trim();
let mobile=document.getElementById("mobile").value.trim();
let password=document.getElementById("password").value;
let confirm=document.getElementById("confirm").value;

if(name=="" || email=="" || mobile=="" || password=="" || confirm==""){

alert("Please fill all the fields.");
return;

}

if(mobile.length!=10){

alert("Enter a valid 10-digit mobile number.");
return;

}

if(password!=confirm){

alert("Passwords do not match.");
return;

}

alert("🎉 Registration Successful!");

window.location.href="login.html";

}

</script>

<footer>

<h2>🎁 AI Gift Recommendation System</h2>

<p style="margin-top:10px;">
Create your account and discover personalized AI gift recommendations.
</p>

<p style="margin-top:15px;">
© 2026 AI Gift Recommendation System. All Rights Reserved.
</p>

</footer>

</body>
</html>
