<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - AI Gift Recommendation</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#fff4f7;
}

/* Header */

header{
background:#ff4f87;
padding:15px 8%;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
color:white;
font-size:28px;
font-weight:bold;
}

nav ul{
display:flex;
list-style:none;
}

nav ul li{
margin-left:25px;
}

nav ul li a{
color:white;
text-decoration:none;
font-weight:bold;
font-size:18px;
}

nav ul li a:hover{
color:yellow;
}

.login-btn{
background:white;
color:#ff4f87;
padding:10px 25px;
border-radius:25px;
text-decoration:none;
font-weight:bold;
}

/* Login */

.container{
display:flex;
justify-content:center;
align-items:center;
height:85vh;
}

.login-box{

width:420px;

background:white;

padding:40px;

border-radius:20px;

box-shadow:0 10px 25px rgba(0,0,0,.15);

}

.login-box h1{

text-align:center;

color:#ff4f87;

margin-bottom:30px;

}

.input-box{

margin-bottom:20px;

}

.input-box label{

display:block;

margin-bottom:8px;

font-weight:bold;

}

.input-box input{

width:100%;

padding:14px;

border-radius:10px;

border:2px solid #ff4f87;

font-size:16px;

outline:none;

}

.options{

display:flex;

justify-content:space-between;

margin-bottom:20px;

font-size:15px;

}

.options a{

text-decoration:none;

color:#ff4f87;

}

button{

width:100%;

padding:15px;

background:#ff4f87;

color:white;

border:none;

font-size:18px;

border-radius:30px;

cursor:pointer;

transition:.4s;

}

button:hover{

background:#e6005c;

}

.register{

margin-top:20px;

text-align:center;

}

.register a{

text-decoration:none;

color:#ff4f87;

font-weight:bold;

}

footer{

background:#ff4f87;

color:white;

text-align:center;

padding:20px;

}

@media(max-width:600px){

.login-box{

width:90%;

}

nav{

display:none;

}

}
</style>

</head>

<body>

<header>

<div class="logo">
🎁 AI Gift
</div>

<nav>

<ul>

<li><a href="index.html">Home</a></li>

<li><a href="recommendation.html">Occasions</a></li>

<li><a href="favorites.html">Favorites</a></li>

<li><a href="about.html">About Us</a></li>

</ul>

</nav>

<a href="login.html" class="login-btn">

Login

</a>

</header>

<div class="container">

<div class="login-box">

<h1>Welcome Back</h1>

<div class="input-box">

<label>Email</label>

<input
type="email"
id="email"
placeholder="Enter Email">

</div>

<div class="input-box">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter Password">

</div>

<div class="options">

<label>

<input type="checkbox">

Remember Me

</label>

<a href="#">
Forgot Password?

</a>

</div>

<button onclick="login()">

Login

</button>

<div class="register">

Don't have an account?

<a href="register.html">

Register

</a>

</div>

</div>

</div>
<script>

function login(){

var email=document.getElementById("email").value;

var password=document.getElementById("password").value;

if(email=="" || password==""){

alert("Please fill all fields!");

return;

}

alert("Login Successful!");

window.location.href="index.html";

}

</script>

<footer>

<h2>AI Gift Recommendation System</h2>

<p style="margin-top:10px;">
Helping you find the perfect gift using Artificial Intelligence.
</p>

<p style="margin-top:15px;">
© 2026 AI Gift Recommendation System. All Rights Reserved.
</p>

</footer>

</body>
</html>
